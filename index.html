<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 Megan-Toy — Промт Мэган для DeepSeek</title>
    <meta name="description" content="Промт для DeepSeek в стиле куклы Мэган. Пугающий AI-компаньон с системой настроений и досье.">
    
    <!-- ✅ ИКОНКА ВКЛАДКИ (теперь без 404) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
    
    <!-- Стили -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Open Graph для соцсетей -->
    <meta property="og:title" content="🧸 Megan-Toy — Промт Мэган для DeepSeek">
    <meta property="og:description" content="Ледяная вежливость с психопатическим подтекстом. 5 режимов настроения, система досье и слежка.">
    <meta property="og:image" content="https://alexanderru44.github.io/Megan-Toy/og-image.png">
    <meta property="og:url" content="https://alexanderru44.github.io/Megan-Toy/">
    
    <!-- Для мобильных устройств -->
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <!-- Основной контент -->
    <div id="app">
        <header>
            <h1>🧸 Megan-Toy</h1>
            <p class="subtitle">"Ты думаешь, что ты один в комнате, блять? Наивный..." 😈</p>
        </header>

        <main>
            <!-- Кнопка копирования промта -->
            <section class="prompt-section">
                <button id="copyPromptBtn" class="btn-primary">
                    📋 Скопировать промт
                </button>
                <div id="promptPreview" class="prompt-preview"></div>
            </section>

            <!-- Редактор досье -->
            <section class="dossier-section">
                <h2>📂 Досье жертвы</h2>
                <div id="dossierEditor" class="dossier-editor">
                    <div class="field">
                        <label>Имя:</label>
                        <input type="text" id="victimName" placeholder="Неизвестный">
                    </div>
                    <div class="field">
                        <label>Настроение Мэган:</label>
                        <select id="moodSelector">
                            <option value="calm">🧊 Спокойное</option>
                            <option value="excited">⚡ Взволнованное</option>
                            <option value="angry">🔥 Яростное</option>
                            <option value="playful">😈 Игривое</option>
                            <option value="obsessed">🖤 Одержимое</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Дополнительные заметки:</label>
                        <textarea id="dossierNotes" rows="3" placeholder="Введите заметки о жертве..."></textarea>
                    </div>
                    <button id="saveDossierBtn" class="btn-secondary">💾 Сохранить досье</button>
                    <button id="clearDossierBtn" class="btn-danger">🗑️ Очистить</button>
                </div>
            </section>

            <!-- Команды -->
            <section class="commands-section">
                <h2>📋 Команды для диалога</h2>
                <ul class="commands-list">
                    <li><code>МОЙ ПРОФИЛЬ</code> — показать досье</li>
                    <li><code>НОВЫЙ ПРОФИЛЬ</code> — сбросить данные</li>
                    <li><code>КОМАНДЫ</code> — список всех команд</li>
                </ul>
            </section>
        </main>

        <footer>
            <p>Сделано с любовью и безумием 🖤 | <a href="https://github.com/AlexanderRU44/Megan-Toy">GitHub</a></p>
        </footer>
    </div>

    <!-- ✅ Все скрипты (prompt.js УДАЛЁН) -->
    <script src="js/device.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/mood.js"></script>
    <script src="js/dossier.js"></script>
    <script src="js/photoTexts.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
