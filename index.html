<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 Megan-Toy — Megan's Prompt</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Шапка -->
    <header>
        <div id="traitBadge">
            <span>скрытая психопатия</span>
            <span class="inline-heart">🫀</span>
        </div>
        <div id="randomQuote">«Я слышу, как ты дышишь...» 🎧</div>
    </header>

    <!-- Основной блок -->
    <main>
        <div id="prompt-container">
            <div id="fullPrompt"></div>
            <button id="copyPromptBtn" onclick="copyPrompt()" data-i18n="copy.btn">📋 Скопировать промт</button>
        </div>
    </main>

    <!-- Модальные окна -->
    <div id="notifOverlay" style="display:none;">
        <div id="notification">
            <span id="notifIcon">👻</span>
            <h2 id="notifTitle" data-i18n="greeting.title">Мэган проснулась...</h2>
            <p id="notifText" data-i18n="greeting.text">Хе-хе-хе... Я вижу, ты вернулся.</p>
            <button id="notifMainBtn" data-i18n="greeting.btn">Понятно</button>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="js/locales.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/dossier.js"></script>
    <script src="js/mood.js"></script>
    <script src="js/main.js"></script>
    <script src="js/about.js"></script>
</body>
</html>
