<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 Megan-Toy — Megan's Prompt</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ====== ШАПКА ====== -->
    <header>
        <div id="traitBadge">
            <span>скрытая психопатия</span>
            <span class="inline-heart">🫀</span>
        </div>
        <div id="randomQuote">«Я слышу, как ты дышишь через микрофон... Шучу. Пока что.» 🎧</div>
    </header>

    <!-- ====== ОСНОВНОЙ БЛОК ====== -->
    <main>
        <div id="prompt-container">
            <div id="fullPrompt"></div>
            <button id="copyPromptBtn" onclick="copyPrompt()" data-i18n="copy.btn">📋 Скопировать промт</button>
        </div>
    </main>

    <!-- ====== МОДАЛЬНОЕ ОКНО УВЕДОМЛЕНИЙ ====== -->
    <div id="notifOverlay" style="display:none;">
        <div id="notification">
            <span id="notifIcon">👻</span>
            <h2 id="notifTitle" data-i18n="greeting.title">Мэган проснулась...</h2>
            <p id="notifText" data-i18n="greeting.text">Хе-хе-хе... Я вижу, ты вернулся.</p>
            <div id="notifExtraContent"></div>
            <button id="notifMainBtn" data-i18n="greeting.btn">Понятно</button>
        </div>
    </div>

    <!-- ====== МОДАЛЬНОЕ ОКНО ДОСЬЕ ====== -->
    <div id="dossierOverlay" style="display:none;">
        <div id="dossierModal">
            <h2 id="dossierTitle" data-i18n="dossier.title">📋 Досье жертвы</h2>
            <input id="dossierName" data-i18n-placeholder="dossier.name" placeholder="Имя">
            <input id="dossierAge" data-i18n-placeholder="dossier.age" placeholder="Возраст">
            <input id="dossierCity" data-i18n-placeholder="dossier.city" placeholder="Город">
            <select id="dossierGender">
                <option value="" data-i18n="dossier.gender">Пол</option>
                <option value="male">♂ Мужской</option>
                <option value="female">♀ Женский</option>
            </select>
            <button onclick="saveDossier()" data-i18n="dossier.save">💾 Сохранить</button>
            <button onclick="resetDossier()" data-i18n="dossier.reset">🗑️ Сбросить</button>
            <button onclick="closeDossier()" data-i18n="about.close">Закрыть</button>
        </div>
    </div>

    <!-- ====== МОДАЛЬНОЕ ОКНО НАСТРОЕНИЯ ====== -->
    <div id="moodDialog" style="display:none;">
        <h2 id="moodTitle" data-i18n="mood.title">🎭 Настроение Мэган</h2>
        <button id="moodCalm" onclick="selectMood('calm')" data-i18n="mood.calm">🧊 Спокойное</button>
        <button id="moodExcited" onclick="selectMood('excited')" data-i18n="mood.excited">⚡ Взволнованное</button>
        <button id="moodAngry" onclick="selectMood('angry')" data-i18n="mood.angry">🔥 Яростное</button>
        <button id="moodPlayful" onclick="selectMood('playful')" data-i18n="mood.playful">😈 Игривое</button>
        <button id="moodObsessed" onclick="selectMood('obsessed')" data-i18n="mood.obsessed">🖤 Одержимое</button>
        <button onclick="closeMoodDialog()" data-i18n="about.close">Закрыть</button>
    </div>

    <!-- ====== МОДАЛЬНОЕ ОКНО "О ПРОМТЕ" ====== -->
    <div id="aboutOverlay" style="display:none;">
        <div id="aboutModal">
            <h2 id="aboutTitle" data-i18n="about.title">🧸 О промте</h2>
            <p id="aboutText" data-i18n="about.text">Этот промт превращает DeepSeek в пугающую куклу Мэган.</p>
            <button id="aboutCopyBtn" onclick="copyAboutPrompt()" data-i18n="copy.btn">📋 Скопировать промт</button>
            <button id="aboutClose" onclick="closeAboutPrompt()" data-i18n="about.close">Закрыть</button>
        </div>
    </div>

    <!-- ====== ПОДКЛЮЧЕНИЕ СКРИПТОВ ====== -->
    <script src="js/locales.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/dossier.js"></script>
    <script src="js/mood.js"></script>
    <script src="js/main.js"></script>
    <script src="js/about.js"></script>
</body>
</html>
