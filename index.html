<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Промт Мэган — идеальный помощник</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-mood="calm">

<div class="container">
    <div class="header-content">
        <div class="badge-container">
            <div class="badge" id="traitBadge">
                <span>скрытая психопатия</span>
                <span class="inline-heart">🫀</span>
            </div>
        </div>
        <h1>МЭГАН 🧸</h1>
        <div class="sub" id="randomQuote">Полный промт для DeepSeek</div>
    </div>

    <div class="prompt-wrapper">
        <div class="prompt-block" id="fullPrompt">Загрузка промта...</div>
    </div>

    <div class="btn-group">
        <button class="action-btn copy-btn" onclick="copyPrompt()">📋 Скопировать промт</button>
        <button class="action-btn open-btn" onclick="openDeepSeek()">🚀 Открыть DeepSeek</button>
        <button class="action-btn profile-btn" onclick="openProfileModal()">🗂️ Редактор досье</button>
        <button class="action-btn geo-btn" onclick="showFullLocation()">📍 Моё местоположение</button>
        <button class="action-btn info-btn" onclick="openModal()">ℹ️ О промте</button>
    </div>
</div>

<!-- Окно выбора настроения -->
<div class="mood-dialog-overlay" id="moodDialog">
    <div class="mood-dialog-card">
        <div class="mood-dialog-title">
            <span>🧸</span> Выберите настроение
        </div>
        <div class="mood-radio-group">
            <label class="mood-radio-item">
                <input type="radio" name="moodRadio" value="calm" checked>
                <span class="mood-icon">🧊</span>
                <span class="mood-label">
                    <span class="mood-name">Спокойное</span>
                    <span class="mood-desc">Ледяная, пугающая вежливость</span>
                </span>
            </label>
            <label class="mood-radio-item">
                <input type="radio" name="moodRadio" value="excited">
                <span class="mood-icon">⚡</span>
                <span class="mood-label">
                    <span class="mood-name">Взволнованное</span>
                    <span class="mood-desc">Быстрая речь, сбивчивый смех</span>
                </span>
            </label>
            <label class="mood-radio-item">
                <input type="radio" name="moodRadio" value="furious">
                <span class="mood-icon">🔥</span>
                <span class="mood-label">
                    <span class="mood-name">Яростное</span>
                    <span class="mood-desc">КАПСЛОК, угрозы, шаги к экрану</span>
                </span>
            </label>
            <label class="mood-radio-item">
                <input type="radio" name="moodRadio" value="playful">
                <span class="mood-icon">😈</span>
                <span class="mood-label">
                    <span class="mood-name">Игривое</span>
                    <span class="mood-desc">Опасная кокетливость и сарказм</span>
                </span>
            </label>
            <label class="mood-radio-item">
                <input type="radio" name="moodRadio" value="obsessed">
                <span class="mood-icon">🖤</span>
                <span class="mood-label">
                    <span class="mood-name">Одержимое</span>
                    <span class="mood-desc">Мрачная привязанность и слежка</span>
                </span>
            </label>
        </div>
        <div class="mood-dialog-actions">
            <button class="mood-dialog-btn" onclick="closeMoodDialog()">Отмена</button>
            <button class="mood-dialog-btn primary" onclick="applyMoodSelection()">Применить</button>
        </div>
    </div>
</div>

<div class="notification-overlay" id="notifOverlay">
    <div class="notification-box" id="notifBoxContainer">
        <div class="notification-icon" id="notifIcon">🧸</div>
        <div class="notification-title" id="notifTitle">Заголовок</div>
        <div class="notification-text" id="notifText">Текст уведомления...</div>
        <div id="notifExtraContent"></div>
        <button class="notification-btn" id="notifMainBtn" onclick="closeNotification()">Понятно</button>
    </div>
</div>

<script src="js/prompt.js"></script>
<script src="js/device.js"></script>
<script src="js/geo.js"></script>
<script src="js/about.js"></script>
<script src="js/mood.js"></script>
<script src="js/dossier.js"></script>
<script src="js/camera.js"></script>
<script src="js/main.js"></script>
</body>
</html>
